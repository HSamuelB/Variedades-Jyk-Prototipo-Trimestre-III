<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Variedades J&K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">    
    <link rel="stylesheet" href="../comun.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">JK</div>
            <div><h2>Variedades J y K</h2><p>Gestión de tienda</p></div>
        </div>
        <nav class="sidebar-nav">
            <a href="../panel-de-control/index.html">🏠 <span>Inicio</span></a>
            <a href="../ventas/index.html">🛒 <span>Ventas</span></a>
            <a href="../inventario/index.html">📦 <span>Productos</span></a>
            <a href="#" onclick="alert('Módulo próximamente');return false;">🚚 <span>Proveedores</span> <span class="badge-prox">próx.</span></a>
            <a href="../usuarios/index.html">👥 <span>Usuarios</span></a>
            <a href="../analisis/index.html">📈 <span>Análisis</span></a>
            <a href="../configuracion/index.html">⚙️ <span>Configuración</span></a>
        </nav>
        <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
    </aside>

    <div class="contenido">
        <header class="header">
            <div class="header-busqueda"><input type="text" placeholder="Buscar en toda la tienda..."></div>
            <div class="header-usuario">
                <div class="avatar" id="avatarInicial">—</div>
                <div class="info">
                    <h4 id="nombreUsuario">—</h4>
                    <p id="rolUsuario">—</p>
                </div>
            </div>
        </header>

        <main class="page">
            <div class="page-header">
                <div>
                    <h1>Usuarios</h1>
                    <p>Gestión de cuentas y permisos del sistema</p>
                </div>
                <button class="btn btn-azul" id="btnNuevoUsuario">+ Nuevo usuario</button>
            </div>

            <div class="filtros-busqueda" style="margin-bottom:20px">
                <input type="text" id="buscarUsuario" placeholder="🔍  Buscar usuario...">
            </div>

            <div class="tabla-wrap">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoUsuarios"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalUsuario">
        <div class="modal">
            <div class="modal-header">
                <h2 id="tituloModalUsuario">Nuevo usuario</h2>
                <button class="btn-cerrar" onclick="cerrarModal('modalUsuario')">✕</button>
            </div>
            <form id="formUsuario">
                <input type="hidden" id="userId">

                <div class="form-grupo">
                    <label>Nombre completo</label>
                    <input type="text" id="userNombre" required placeholder="Ej: Karen Gómez">
                </div>

                <div class="form-grupo">
                    <label>Nombre de usuario</label>
                    <input type="text" id="userUsuario" required placeholder="Ej: kgomez">
                </div>

                <div class="form-grupo">
                    <label>Contraseña</label>
                    <div class="input-pass">
                        <input type="password" id="userPassword" placeholder="••••••••">
                        <span class="ojo" id="ojoUsuario">👁️</span>
                    </div>
                    <small class="ayuda" id="ayudaPass">Dejar en blanco para no cambiar</small>
                </div>

                <div class="form-grupo">
                    <label>Rol</label>
                    <select id="userRol">
                        <option>Administradora</option>
                        <option>Vendedor</option>
                    </select>
                </div>

                <div class="form-acciones">
                    <button type="button" class="btn btn-blanco" onclick="cerrarModal('modalUsuario')">Cancelar</button>
                    <button type="submit" class="btn btn-naranja">💾 Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="toastNotification" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <script src="../datos.js"></script>
    <script src="script.js"></script>
</body>
</html>
