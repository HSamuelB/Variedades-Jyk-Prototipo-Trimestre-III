<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Variedades J&K</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../comun.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">JK</div>
            <div><h2>Variedades J y K</h2><p>Gestión de tienda</p></div>
        </div>
        <nav class="sidebar-nav">
            <a href="../panel-de-control/index.html"><i class="fa-solid fa-house fa-flip-horizontal" style="color: rgb(203, 213, 225);"></i> <span>Inicio</span></a>
            <a href="../ventas/index.html"><i class="fa-solid fa-cart-shopping" style="color: rgb(203, 213, 225);"></i> <span>Ventas</span></a>
            <a href="../inventario/index.html"><i class="fa-solid fa-box" style="color: rgb(203, 213, 225);"></i> <span>Productos</span></a>
            <a href="#" onclick="alert('Módulo próximamente');return false;"><i class="fa-solid fa-truck" style="color: rgb(203, 213, 225);"></i> <span>Proveedores</span> <span class="badge-prox">próx.</span></a>
            <a href="../usuarios/index.html" data-solo-admin><i class="fa-solid fa-users" style="color: rgb(203, 213, 225);"></i> <span>Usuarios</span></a>
            <a href="../analisis/index.html"><i class="fa-solid fa-square-poll-vertical" style="color: rgb(203, 213, 225);"></i> <span>Análisis</span></a>
            <a href="../configuracion/index.html"><i class="fa-solid fa-gear" style="color: rgb(203, 213, 225);"></i>    <span>Configuración</span></a>
        </nav>
        <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
    </aside>

    <div class="contenido">
        <header class="header">
            <div class="header-busqueda"><input type="text" placeholder="Buscar en toda la tienda..."></div>
            <div class="header-usuario">
                <div class="avatar" id="avatarInicial">—</div>
                <div class="info">
                    <h4 id="nombreUsuario">—</h4>
                    <p id="rolUsuario">—</p>
                </div>
            </div>
        </header>

        <main class="page ventas-layout">
            <div class="ventas-main">
                <div class="page-header">
                    <div>
                        <h1>Registrar venta</h1>
                        <p>Busca o toca un producto para agregarlo al carrito</p>
                    </div>
                </div>

                <div class="buscador-ventas">
                    <input type="text" id="buscarVenta" placeholder="  Buscar por nombre o código...">
                </div>

                <div class="chips" id="chipsVentas"></div>

                <div class="grid-productos" id="gridProductos"></div>
            </div>

            <aside class="carrito">
                <div class="carrito-header">
                    <h3><i class="fa-solid fa-cart-shopping" style="color: rgb(2, 2, 2);"></i> Carrito</h3>
                </div>
                <div class="carrito-items" id="carritoItems"></div>

                <div class="carrito-pago" id="carritoPago" style="display:none">
                    <p class="pago-titulo">Método de pago</p>
                    <div class="metodos">
                        <button class="metodo" data-metodo="Efectivo">💵<span>Efectivo</span></button>
                        <button class="metodo" data-metodo="Nequi">📱<span>Nequi</span></button>
                        <button class="metodo" data-metodo="PSE">🏛️<span>PSE</span></button>
                    </div>

                    <div id="pagoEfectivo" style="display:none">
                        <div class="pago-fila"><span>Recibido</span> <input type="number" id="recibido" value="0" min="0"></div>
                        <div class="pago-fila"><span>Cambio a devolver</span> <strong id="cambio" style="color:var(--verde)">$0</strong></div>
                    </div>
                </div>

                <div class="carrito-footer">
                    <div class="pago-fila"><span>Total</span> <h3 id="totalCarrito" style="color:var(--azul)">$0</h3></div>
                    <button class="btn btn-verde btn-full" id="btnFinalizar">✓ Finalizar venta</button>
                    <button class="btn-link" id="btnVaciar">Vaciar carrito</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="../datos.js"></script>
    <script src="script.js"></script>
</body>
</html>
