<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Variedades J&K</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-container">
        <div class="bg-slide active" style="background-image: url(img/Carrusel1.jpeg);"></div>
        <div class="bg-slide" style="background-image: url(img/Carrusel2.jpeg);"></div>
        <div class="bg-slide" style="background-image: url(img/Carrusel3.jpeg);"></div>
        <div class="bg-overlay"></div>
    </div>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <div class="logo-container">
                    <img src="img/Box.png" class="logo-icon">
                </div>
                <h1>Variedades J&K</h1>
                <p class="subtitle">sistema de inventario</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                        <span class="toggle-password" id="togglePassword"><i class="fa-solid fa-eye" style="color: rgb(0, 0, 0);"></i></span>
                    </div>
                </div>
                <button type="submit" class="btn-login">Iniciar sesión</button>
            </form>
        </div>
    </main>

    <script src="../datos.js"></script>
    <script src="script.js"></script>
</body>
</html>
