<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda - Gestión de Usuarios</title>
    <!-- Enlace a los estilos CSS externos -->
    <link rel="stylesheet" href="style.css">
    <!-- Enlace a FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- MENÚ LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-box-archive"></i>
                <span>Mi Tienda</span>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-box"></i> Productos</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-right-to-bracket"></i> Entradas</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Salidas</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-clipboard-list"></i> Inventario</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Reportes</a>
                <a href="#" class="menu-item active"><i class="fa-solid fa-users"></i> Usuarios</a>
                <a href="#" class="menu-item"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <!-- BARRA SUPERIOR -->
            <header class="topbar">
                <div class="user-profile">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Administrador</span>
                </div>
            </header>

            <!-- SECCIÓN DE USUARIOS -->
            <section class="content-section">
                <div class="section-header">
                    <h2>Usuarios</h2>
                </div>

                <!-- CONTROLES (Buscador y Botón Nuevo Usuario) -->
                <div class="controls-bar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Buscar usuario...">
                    </div>
                    <button id="openModalBtn" class="btn-primary">
                        <i class="fa-solid fa-plus"></i> Nuevo usuario
                    </button>
                </div>

                <!-- TABLA DE USUARIOS -->
                <div class="table-responsive">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Los usuarios se cargarán dinámicamente con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL PARA AGREGAR / EDITAR USUARIO -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Usuario</h3>
                <span class="close-modal">&times;</span>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required placeholder="Ingresa tu nombre">
                </div>

                <div class="form-group">
                    <label for="username">Nombre de usuario (Login)</label>
                    <input type="text" id="username" required placeholder="Ingreda usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <!-- Contenedor relativo para posicionar el icono del ojo -->
                    <div class="password-input-container">
                        <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                        <button type="button" id="togglePassword" class="btn-toggle-password" title="Mostrar contraseña">
                            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" required>
                        <option value="Administrador">Administrador</option>
                        <option value="Vendedor">Vendedor</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Cancelar</button>
                    <button type="submit" class="btn-primary" id="saveUserBtn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN PARA ELIMINAR -->
    <div id="deleteModal" class="modal">
        <div class="modal-content delete-content">
            <h3>¿Estás seguro?</h3>
            <p>Esta acción eliminará al usuario permanentemente.</p>
            <div class="form-actions">
                <button type="button" class="btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button type="button" class="btn-danger" id="confirmDeleteBtn">Eliminar</button>
            </div>
        </div>
    </div>
    <!-- Notificación Flotante -->
    <div id="toastNotification" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
